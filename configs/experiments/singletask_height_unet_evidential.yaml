# Single-task evidential U-Net – mean_height only
# Output: [B, 4, H, W]  (γ, ν, α, β for height)

data:
  root: /data/4g.zarr
  split_file: /data/4g.zarr/patch_index_subset.parquet

  split_column: split
  patch_idx_column: zarr_idx

  s1_seasons: [summer, autumn, spring, winter]
  s2_seasons: [summer, autumn, spring, winter]
  use_species: true

  valid_mask_mode: notnull

  targets: [mean_height]

  target_transform:
    mean_height: log1p

  norm_stats_path: /workspace/artifacts/norm_stats.json

model:
  name: unet_evidential

  unet:
    encoder_name: resnet50
    encoder_weights: imagenet
    decoder_channels: [256, 128, 64, 32, 16]

training:
  seed: 42
  deterministic: false

  batch_size: 64
  num_workers: 12
  prefetch_factor: 2
  pin_memory: true

  cudnn_benchmark: true
  ddp: false

  epochs: 100
  lr: 1.0e-4
  weight_decay: 1.0e-4

  scheduler: cosine

  loss: evidential_nig

  evidential:
    lambda_coef: 0.1

  loss_weights:
    mean_height: 1.0

  gradient_accumulation_steps: 1
  amp: true

  validate_every_n_epochs: 5
  early_stopping_patience: 10

  save_dir: /workspace/artifacts/experiments/singletask_height_unet_evidential/checkpoints

logging:
  tensorboard_dir: /workspace/artifacts/experiments/singletask_height_unet_evidential/runs
  csv_path: /workspace/artifacts/experiments/singletask_height_unet_evidential/metrics.csv
  log_every_n_steps: 10
